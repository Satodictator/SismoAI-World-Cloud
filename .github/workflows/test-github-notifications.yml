name: SismoAI GitHub Notification Test

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test-github-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify notification module
        run: python -m sismoai_world.notifications selftest

      - name: Create assigned GitHub notification test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: Satodictator
          SISMOAI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m sismoai_world.notifications test-github --assignee Satodictator
