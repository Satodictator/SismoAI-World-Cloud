name: SismoAI Telegram Private Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify notification module
        run: python -m sismoai_world.notifications selftest

      - name: Send private Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python -m sismoai_world.notifications test
