name: SismoAI World Operations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo de operación"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
          - daily
          - weekly
          - bootstrap
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 3 * * *"
    - cron: "29 4 * * 0"

permissions:
  contents: write
  issues: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: sismoai-world-state
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  SHARD_COUNT: "5"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve operation mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
          SCHEDULE_VALUE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            MODE="${DISPATCH_MODE:-fast}"
          elif [[ "$SCHEDULE_VALUE" == "29 4 * * 0" ]]; then
            MODE="weekly"
          elif [[ "$SCHEDULE_VALUE" == "43 3 * * *" ]]; then
            MODE="daily"
          else
            MODE="fast"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Modo resuelto: $MODE"

      - name: Restore persistent state branch
        run: bash scripts/prepare_state.sh state_input

      - name: Upload state input
        uses: actions/upload-artifact@v4
        with:
          name: state-input-${{ github.run_id }}
          path: state_input
          retention-days: 1
          if-no-files-found: error

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned scientific dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Download persistent state
        uses: actions/download-artifact@v4
        with:
          name: state-input-${{ github.run_id }}
          path: state_input

      - name: Acquire renewable Earthdata token
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EARTHDATA_SHARD_INDEX: ${{ matrix.shard }}
          SISMOAI_MODE: ${{ needs.prepare.outputs.mode }}
        run: python scripts/earthdata_runtime_token.py

      - name: Run regional shard
        run: |
          python -m sismoai_world.cli run-shard \
            --regions config/world_regions.json \
            --mode "${{ needs.prepare.outputs.mode }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "$SHARD_COUNT" \
            --state-dir state_input/state/regions \
            --runtime-root runtime \
            --output-root shard_output

      - name: Upload shard output
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-${{ github.run_id }}
          path: shard_output
          retention-days: 1
          if-no-files-found: error

  aggregate:
    needs: [prepare, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download previous state
        uses: actions/download-artifact@v4
        with:
          name: state-input-${{ github.run_id }}
          path: state_input

      - name: Download all shard outputs
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*-${{ github.run_id }}
          path: collected
          merge-multiple: true

      - name: Verify historical laboratory isolation
        run: |
          python -m sismoai_world.historical selftest
          python -m sismoai_world.sensor_gateway selftest
          python -m sismoai_world.evolutionary selftest
          python -m sismoai_world.shadow selftest
          python -m sismoai_world.selftest

      - name: Advance isolated historical replay and pattern research
        run: |
          python -m sismoai_world.historical run \
            --input-archive state_input/research/historical.sqlite.gz \
            --work-dir historical_runtime \
            --output-dir collected/research \
            --region-archives collected/state/regions \
            --region-archives state_input/state/regions \
            --result-dir collected/results/regions \
            --result-dir state_input/results/regions \
            --mode "${{ needs.prepare.outputs.mode }}"

      - name: Build worldwide ranking and static dashboard
        run: |
          python -m sismoai_world.cli aggregate \
            --regions config/world_regions.json \
            --collected-results collected/results/regions \
            --state-results state_input/results/regions \
            --historical-summary collected/research/historical_summary.json \
            --previous-world-dir state_input/history/world \
            --previous-bulletins-dir state_input/history/bulletins \
            --docs docs \
            --mode "${{ needs.prepare.outputs.mode }}"

      - name: Advance persistent evolutionary pattern memory
        continue-on-error: true
        run: |
          python -m sismoai_world.evolutionary run \
            --historical-db historical_runtime/historical.sqlite \
            --region-archives collected/state/regions \
            --region-archives state_input/state/regions \
            --input-state-archive state_input/research/evolutionary.sqlite.gz \
            --output-state-archive collected/research/evolutionary.sqlite.gz \
            --output-json docs/data/evolutionary.json \
            --policy config/evolution_policy.json \
            --manifest docs/data/manifest.json \
            --manifest-sha docs/data/manifest.sha256



      - name: Restore latest universal sensor gateway snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil

          from sismoai_world.sensors_page import SENSORS_HTML

          docs = Path("docs")
          data = docs / "data"
          data.mkdir(parents=True, exist_ok=True)
          (docs / "sensors.html").write_text(SENSORS_HTML, encoding="utf-8")
          source = Path("state_input/public_site/data/sensors.json")
          target = data / "sensors.json"
          if source.exists():
              shutil.copy2(source, target)
          elif not target.exists():
              target.write_text(
                  json.dumps(
                      {
                          "schema_version": 1,
                          "generated_at": None,
                          "status": "WAITING_FOR_FIRST_SENSOR_RUN",
                          "totals": {
                              "sources_registered": 0,
                              "sources_active_or_available": 0,
                              "nodes": 0,
                              "observations": 0,
                              "features": 0,
                              "errors_24h": 0,
                          },
                          "sources": [],
                          "families": [],
                          "region_coverage": [],
                          "recent_observations": [],
                          "scientific_notice": (
                              "Gateway universal todavía no ejecutado; no modifica "
                              "IEDC, alertas ni ventanas."
                          ),
                      },
                      ensure_ascii=False,
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )
          manifest_path = data / "manifest.json"
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              files = list(manifest.get("files") or [])
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              entry = {"path": "data/sensors.json", "sha256": digest}
              replaced = False
              for index, item in enumerate(files):
                  if item.get("path") == "data/sensors.json":
                      files[index] = entry
                      replaced = True
                      break
              if not replaced:
                  files.append(entry)
              files.sort(key=lambda item: str(item.get("path") or ""))
              manifest["files"] = files
              manifest_path.write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              (data / "manifest.sha256").write_text(
                  hashlib.sha256(manifest_path.read_bytes()).hexdigest()
                  + "  manifest.json\n",
                  encoding="utf-8",
              )
          PY

      - name: Generate multiple prospective shadow windows
        run: |
          python -m sismoai_world.shadow run \
            --world docs/data/world.json \
            --historical docs/data/historical.json \
            --historical-db historical_runtime/historical.sqlite \
            --regions config/world_regions.json \
            --policy config/shadow_policy.json \
            --region-archives collected/state/regions \
            --region-archives state_input/state/regions \
            --previous-state state_input/research/shadow_state.json \
            --output docs/data/shadow.json \
            --output-state collected/research/shadow_state.json \
            --manifest docs/data/manifest.json \
            --manifest-sha docs/data/manifest.sha256

      - name: Evaluate automatic GitHub and optional Telegram notifications
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: Satodictator
          SISMOAI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          python -m sismoai_world.notifications run \
            --world docs/data/world.json \
            --policy config/notification_policy.json \
            --previous-state state_input/notifications/state.json \
            --output-state collected/notifications/state.json \
            --shadow docs/data/shadow.json \
            --manifest docs/data/manifest.json \
            --manifest-sha docs/data/manifest.sha256


      - name: Preserve public site snapshot for hourly evolution
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f docs/data/evolutionary.json && -f state_input/public_site/data/evolutionary.json ]]; then
            mkdir -p docs/data
            cp state_input/public_site/data/evolutionary.json docs/data/evolutionary.json
          fi
          rm -rf collected/public_site
          mkdir -p collected/public_site
          cp -a docs/. collected/public_site/

      - name: Assemble compact persistent state
        run: |
          python scripts/build_state.py \
            --previous state_input \
            --collected collected \
            --world docs/data/world.json \
            --bulletin docs/data/bulletin.json \
            --output state_publish \
            --retention-days 180

      - name: Publish one-commit state branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SISMOAI_MODE: ${{ needs.prepare.outputs.mode }}
        run: bash scripts/publish_state.sh state_publish

      - name: Append public prospective integrity ledger
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/update_ledger.py \
            --world docs/data/world.json \
            --manifest docs/data/manifest.json \
            --mode "${{ needs.prepare.outputs.mode }}" \
            --run-url "$RUN_URL" \
            --source-commit "${{ github.sha }}"
          git config user.name "sismoai-world-bot"
          git config user.email "sismoai-world-bot@users.noreply.github.com"
          git add audit/public_ledger.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "audit: world result ${{ github.run_id }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
